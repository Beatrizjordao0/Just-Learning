<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#add8e6" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
  </defs>
  <rect width="200" height="200" fill="url(#bgGradient)" />

  <!-- Halo -->
  <circle cx="100" cy="100" r="60" fill="none" stroke="#fdd835" stroke-width="10" opacity="0.7" />

  <!-- Cross Outline -->
  <rect x="95" y="50" width="10" height="100" fill="none" stroke="#000" stroke-width="3" />
  <rect x="70" y="80" width="60" height="10" fill="none" stroke="#000" stroke-width="3" />
</svg>
